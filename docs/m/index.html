<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>킥스캔 현장</title>
<meta name="description" content="PC 킥스캔이 정리한 실적 · 판매 · 재고 · 시세를 휴대폰에서 봐요.">
<meta name="theme-color" content="#3b5cf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="킥스캔">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/48.png" sizes="48x48">
<link rel="apple-touch-icon" href="icons/180.png">
<link rel="stylesheet" href="m.css">
</head>
<body>
<header class="top" id="top">
  <div class="brand"><img src="icons/48.png" alt="" width="30" height="30"><div><b>킥스캔</b><span id="upd">휴대폰 보기</span></div></div>
  <div class="top-btns" id="topBtns" hidden>
    <button type="button" class="ibtn" id="btnRefresh" aria-label="새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg></button>
    <button type="button" class="ibtn" id="btnMenu" aria-label="계정" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>
  </div>
</header>
<div class="menu" id="menu" hidden>
  <p class="menu-mail" id="menuMail"></p>
  <button type="button" class="ghost wide" id="btnLogout">로그아웃</button>
  <p class="note">스캔 · 매입 등록은 이 앱에서, 입찰 · 판매 등록은 PC 킥스캔에서 해요.</p>
</div>

<main id="main">
  <section id="login" class="login" hidden>
    <div class="login-head"><img src="icons/128.png" alt="" width="64" height="64"><h1>킥스캔 현장</h1><p>PC 킥스캔과 같은 계정으로 로그인해요. 매장에서 스캔하고 매입을 등록하면 PC 재고에 1분 안에 들어가요.</p></div>
    <form id="loginForm" autocomplete="on" novalidate>
      <label>이메일<input type="email" id="lEmail" autocomplete="username" inputmode="email" required></label>
      <label>비밀번호<input type="password" id="lPw" autocomplete="current-password" required></label>
      <div class="checks"><label class="chk"><input type="checkbox" id="lRemember" checked> 아이디 저장</label><label class="chk"><input type="checkbox" id="lAuto" checked> 자동 로그인</label></div>
      <button type="submit" class="primary wide" id="lBtn">로그인</button>
      <p class="msg" id="lMsg" role="alert"></p>
      <button type="button" class="linkbtn" id="lForgot">비밀번호를 잊었어요</button>
    </form>
    <p class="note">휴대폰은 PC 등록 수에 들어가지 않아요. 내 계정으로 로그인해야만 내 장사 정보가 보여요.</p>
  </section>

  <section id="app" hidden>
    <p class="banner" id="banner" hidden></p>
    <div id="view"></div>
  </section>
</main>

<nav class="tabs" id="tabs" hidden aria-label="화면">
  <button type="button" data-t="sum" aria-current="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg><span>홈</span></button>
  <button type="button" data-t="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg><span>스캔</span></button>
  <button type="button" data-t="stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg><span>재고</span></button>
  <button type="button" data-t="sales"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span>매출</span></button>
  <button type="button" data-t="buy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h11.2L21 7H6"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/></svg><span>살 것</span></button>
  <button type="button" data-t="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>발매</span></button>
  <button type="button" data-t="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span></button>
</nav>
<script src="m.js"></script>
<script src="receipt.js"></script>
<script src="m2.js"></script>
<script src="drop.js"></script>
<script src="buy.js"></script>
</body>
</html>
